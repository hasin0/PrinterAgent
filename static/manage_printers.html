
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Printers — PrinterAgent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f5f7fb; --panel: #ffffff; --border: #eef2f7;
    --text: #0f172a; --sub: #64748b; --brand: #0067b8; --brand-2: #0087ff;
    --success: #2e7d32; --warning: #f57c00; --error: #c62828;
    --shadow: 0 6px 20px rgba(15,23,42,0.05); --radius: 16px;
}
[data-theme="dark"] {
    --bg: #0b1220; --panel: #131c30; --border: #1e293b;
    --text: #f8fafc; --sub: #94a3b8; --brand: #4fb3ff; --brand-2: #78c9ff;
    --success: #4ade80; --warning: #fbbf24; --error: #f87171;
    --shadow: 0 6px 20px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background: var(--bg); color: var(--text); font-size: 14px;
    transition: background .4s ease, color .4s ease; }

.topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 32px; background:var(--panel); border-bottom:1px solid var(--border);
}
.brand { display:flex; align-items:center; gap:12px; }
.brand .logo {
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800;
}
.brand strong { font-size:14px; } .brand span { font-size:12px; color:var(--sub); display:block; }
.topbar-actions { display:flex; gap:12px; align-items:center; }
.topbar-actions a {
    font-size:13px; text-decoration:none; color:var(--brand); font-weight:600;
    padding:8px 12px; border-radius:10px; background:rgba(0,103,184,0.08);
}
.icon-btn {
    width:34px; height:34px; border-radius:10px; background:var(--panel);
    border:1px solid var(--border); cursor:pointer; display:flex;
    align-items:center; justify-content:center; font-size:15px;
}

.wrap { padding:24px 32px; max-width:1100px; margin:0 auto; display:grid; gap:20px; }
.panel {
    background:var(--panel); border-radius:var(--radius); padding:20px;
    border:1px solid var(--border); box-shadow:var(--shadow);
}
.panel h3 { font-size:15px; font-weight:700; margin-bottom:14px; }

/* Add form */
.add-grid {
    display:grid; grid-template-columns:1.4fr 1fr 1.4fr auto; gap:10px; align-items:end;
}
@media (max-width:820px){ .add-grid{ grid-template-columns:1fr; } }
.field label { font-size:11px; color:var(--sub); font-weight:700;
    text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:5px; }
.field input {
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13.5px;
}
.field input:focus { outline:none; border-color:var(--brand); }

.btn {
    padding:10px 18px; border-radius:9px; border:none; cursor:pointer;
    font-weight:700; font-size:13px; transition:.15s;
}
.btn.primary { background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; }
.btn.primary:hover { filter:brightness(1.07); }
.btn.danger { background:rgba(198,40,40,.12); color:var(--error); }
.btn.save { background:rgba(46,125,50,.14); color:var(--success); }
.btn.sm { padding:6px 11px; font-size:12px; }

/* Table */
.count { font-size:12px; color:var(--sub); font-weight:500; }
.table-wrap { overflow:auto; border-radius:10px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:11px 10px; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle; }
th { background:var(--border); text-transform:uppercase; font-size:11px; letter-spacing:.5px; }
tr:hover { background:rgba(0,103,184,.04); }
td input {
    width:100%; padding:7px 9px; border-radius:7px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13px;
}
td .key { font-family:monospace; font-size:11.5px; color:var(--sub); }
.row-actions { display:flex; gap:6px; }

.toast {
    position:fixed; bottom:24px; right:24px; padding:12px 18px; border-radius:10px;
    font-size:13px; font-weight:600; color:#fff; box-shadow:var(--shadow);
    opacity:0; transform:translateY(10px); transition:.25s; pointer-events:none; z-index:50;
}
.toast.show { opacity:1; transform:translateY(0); }
.toast.ok { background:var(--success); } .toast.err { background:var(--error); }
.empty { text-align:center; padding:26px; color:var(--sub); }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">
        <div class="logo">D</div>
        <div><strong>Dangote Refinery</strong><span>Manage Monitored Printers</span></div>
    </div>
    <div class="topbar-actions">
        <a href="/toner">Toner Center</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/">Home</a>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">🌓</button>
    </div>
</div>

<div class="wrap">

    <!-- ADD -->
    <div class="panel">
        <h3>Add a Printer</h3>
        <div class="add-grid">
            <div class="field">
                <label>Display Name</label>
                <input id="addName" placeholder="e.g. Finance 2nd Floor Printer">
            </div>
            <div class="field">
                <label>IP Address</label>
                <input id="addIp" placeholder="e.g. 172.20.229.92">
            </div>
            <div class="field">
                <label>Location</label>
                <input id="addLoc" placeholder="e.g. New Admin Block">
            </div>
            <div class="field">
                <button class="btn primary" onclick="addPrinter()">+ Add Printer</button>
            </div>
        </div>
    </div>

    <!-- LIST -->
    <div class="panel">
        <h3>Monitored Printers <span class="count" id="count"></span></h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width:22%">Name</th>
                        <th style="width:16%">IP Address</th>
                        <th style="width:24%">Location</th>
                        <th style="width:18%">Key</th>
                        <th style="width:20%">Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="5" class="empty">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ---- theme ---- */
function applyTheme(t){ if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    else document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme",t); }
function toggleTheme(){ const c=document.documentElement.getAttribute("data-theme");
    applyTheme(c==="dark"?"light":"dark"); }
(function(){ const s=localStorage.getItem("theme");
    if(s) applyTheme(s); else if(matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark"); })();

/* ---- toast ---- */
let toastTimer=null;
function toast(msg, ok=true){
    const t=document.getElementById("toast");
    t.textContent=msg; t.className="toast show "+(ok?"ok":"err");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{ t.className="toast "+(ok?"ok":"err"); }, 3000);
}

/* ---- helpers ---- */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

let printers = {};

async function loadPrinters(){
    try{
        const res = await fetch("/api/manage-printers");
        const json = await res.json();
        if(!json.success){ toast(json.error||"Load failed", false); return; }
        printers = json.data || {};
        render();
    }catch(e){ toast("Could not reach server", false); }
}

function render(){
    const keys = Object.keys(printers);
    document.getElementById("count").textContent = `(${keys.length})`;
    const tb = document.getElementById("tbody");

    if(!keys.length){
        tb.innerHTML = `<tr><td colspan="5" class="empty">No printers yet. Add one above.</td></tr>`;
        return;
    }

    tb.innerHTML = keys.map(k=>{
        const p = printers[k];
        return `
        <tr data-key="${esc(k)}">
            <td><input value="${esc(p.display_name)}" data-f="display_name"></td>
            <td><input value="${esc(p.ip)}" data-f="ip"></td>
            <td><input value="${esc(p.location||"")}" data-f="location"></td>
            <td><span class="key">${esc(k)}</span></td>
            <td>
                <div class="row-actions">
                    <button class="btn save sm" onclick="saveRow('${esc(k)}')">Save</button>
                    <button class="btn danger sm" onclick="deleteRow('${esc(k)}','${esc(p.display_name)}')">Delete</button>
                </div>
            </td>
        </tr>`;
    }).join("");
}

async function addPrinter(){
    const display_name = document.getElementById("addName").value.trim();
    const ip = document.getElementById("addIp").value.trim();
    const location = document.getElementById("addLoc").value.trim();

    if(!display_name || !ip){ toast("Name and IP are required", false); return; }

    try{
        const res = await fetch("/api/manage-printers", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ display_name, ip, location })
        });
        const json = await res.json();
        if(!json.success){ toast(json.error||"Add failed", false); return; }

        toast(`Added "${display_name}"`);
        document.getElementById("addName").value="";
        document.getElementById("addIp").value="";
        document.getElementById("addLoc").value="";
        loadPrinters();
    }catch(e){ toast("Could not reach server", false); }
}

async function saveRow(key){
    const tr = document.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
    if(!tr) return;
    const get = f => tr.querySelector(`input[data-f="${f}"]`).value.trim();
    const body = { display_name:get("display_name"), ip:get("ip"), location:get("location") };

    try{
        const res = await fetch(`/api/manage-printers/${encodeURIComponent(key)}`, {
            method:"PUT", headers:{"Content-Type":"application/json"},
            body: JSON.stringify(body)
        });
        const json = await res.json();
        if(!json.success){ toast(json.error||"Save failed", false); return; }
        toast(`Saved "${body.display_name}"`);
        loadPrinters();
    }catch(e){ toast("Could not reach server", false); }
}

async function deleteRow(key, name){
    if(!confirm(`Delete "${name}"?\n\nThis removes it from toner monitoring.`)) return;
    try{
        const res = await fetch(`/api/manage-printers/${encodeURIComponent(key)}`, { method:"DELETE" });
        const json = await res.json();
        if(!json.success){ toast(json.error||"Delete failed", false); return; }
        toast(`Deleted "${name}"`);
        loadPrinters();
    }catch(e){ toast("Could not reach server", false); }
}

loadPrinters();
</script>
</body>
</html>
